<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Middleware Script — preview (sans WinCC OA)</title>
    <link rel="stylesheet" href="/node_modules/@siemens/ix/dist/siemens-ix/siemens-ix.css" />
    <link rel="stylesheet" href="/node_modules/@siemens/ix/dist/siemens-ix/theme/classic-dark.css" />
    <link rel="stylesheet" href="/node_modules/@siemens/ix/dist/siemens-ix/theme/classic-light.css" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--theme-color-1);
        color: var(--theme-color-std-text);
        font-family: 'Siemens Sans', Arial, Helvetica, sans-serif;
      }
      wui-middleware-script {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      #theme-toggle {
        position: fixed;
        right: 0.5rem;
        bottom: 0.5rem;
        z-index: 10;
        padding: 0.25rem 0.5rem;
        font: inherit;
        font-size: 0.75rem;
        color: var(--theme-color-std-text);
        background: var(--theme-color-2);
        border: 1px solid var(--theme-color-soft-bdr);
        border-radius: 4px;
        cursor: pointer;
        opacity: 0.7;
      }
    </style>
    <script type="module">
      import { defineCustomElements as defineIcons } from '/node_modules/@siemens/ix-icons/loader/index.js';
      import { defineCustomElements as defineIx } from '/node_modules/@siemens/ix/loader/index.js';
      defineIcons();
      defineIx();
    </script>
    <script type="module" src="/dist/entry.js"></script>
  </head>
  <body class="theme-classic-dark">
    <wui-middleware-script></wui-middleware-script>
    <!-- Preview helper: exercise the theme-aware editor palette (the page
         itself follows the shell's theme class in a real deployment). -->
    <button id="theme-toggle" type="button">clair / sombre</button>
    <script>
      document.getElementById('theme-toggle').addEventListener('click', () => {
        const dark = document.body.classList.contains('theme-classic-dark');
        document.body.classList.toggle('theme-classic-dark', !dark);
        document.body.classList.toggle('theme-classic-light', dark);
      });
    </script>
  </body>
</html>
